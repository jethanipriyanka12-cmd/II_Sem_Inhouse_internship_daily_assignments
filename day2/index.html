!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration Form</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:linear-gradient(to right,#74ebd5,#ACB6E5);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.container{
    width:500px;
    background:#fff;
    padding:25px;
    border-radius:12px;
    box-shadow:0 0 15px rgba(0,0,0,0.3);
}

h2{
    text-align:center;
    color:#003366;
    margin-bottom:20px;
}

label{
    font-weight:bold;
    display:block;
    margin-top:10px;
}

input[type="text"],
input[type="date"],
input[type="email"],
input[type="tel"],
input[type="file"],
select{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:15px;
}

.gender{
    margin-top:8px;
    margin-bottom:10px;
}

.gender input{
    width:auto;
    margin-right:5px;
}

button{
    width:100%;
    padding:12px;
    margin-top:20px;
    background:#007BFF;
    color:white;
    border:none;
    border-radius:5px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

#thankyou{
    display:none;
    text-align:center;
}

#thankyou h1{
    color:green;
    margin-bottom:15px;
}

#thankyou p{
    font-size:20px;
}
</style>

</head>

<body>

<div class="container">

<div id="formPage">

<h2>Student Registration Form</h2>

<form id="registrationForm">

<label>Full Name</label>
<input type="text" placeholder="Enter your name" required>

<label>Roll Number</label>
<input type="text" placeholder="Enter roll number" required>

<label>Date of Birth</label>
<input type="date" required>

<label>Gender</label>

<div class="gender">
<input type="radio" name="gender" required> Male
<input type="radio" name="gender"> Female
<input type="radio" name="gender"> Other
</div>

<label>Course</label>

<select id="course" required onchange="changeBranch()">
<option value="">Select Course</option>
<option value="B.Tech">B.Tech</option>
<option value="BCA">BCA</option>
<option value="BBA">BBA</option>
<option value="B.Com">B.Com</option>
<option value="MCA">MCA</option>
</select>

<label>Branch</label>

<select id="branch" required>
<option value="">Select Branch</option>
</select>

<label>Mobile Number</label>
<input type="tel" pattern="[0-9]{10}" maxlength="10" placeholder="Enter 10-digit mobile number" required>

<label>Email</label>
<input type="email" placeholder="Enter your email" required>

<label>Upload Passport Size Photo (Maximum 20 MB)</label>
<input type="file" id="photo" accept="image/*" required>

<button type="submit">Submit</button>

</form>

</div>

<div id="thankyou">

<h1>🎉 Thank You! 🎉</h1>

<p>Your registration has been submitted successfully.</p>

<h3>We appreciate your registration.</h3>

</div>

</div>

<script>

function changeBranch(){

var course=document.getElementById("course").value;
var branch=document.getElementById("branch");

branch.innerHTML="<option value=''>Select Branch</option>";

if(course=="B.Tech"){
branch.innerHTML += "<option>Computer Science Engineering</option>";
branch.innerHTML += "<option>Artificial Intelligence</option>";
branch.innerHTML += "<option>Information Technology</option>";
branch.innerHTML += "<option>Mechanical Engineering</option>";
branch.innerHTML += "<option>Civil Engineering</option>";
branch.innerHTML += "<option>Electronics & Communication</option>";
}

else if(course=="BCA"){
branch.innerHTML += "<option>Computer Applications</option>";
}

else if(course=="BBA"){
branch.innerHTML += "<option>Marketing</option>";
branch.innerHTML += "<option>Finance</option>";
branch.innerHTML += "<option>Human Resource</option>";
}

else if(course=="B.Com"){
branch.innerHTML += "<option>General</option>";
branch.innerHTML += "<option>Computer Applications</option>";
}

else if(course=="MCA"){
branch.innerHTML += "<option>Software Development</option>";
branch.innerHTML += "<option>Artificial Intelligence</option>";
}

}

document.getElementById("registrationForm").addEventListener("submit",function(event){

event.preventDefault();

var photo=document.getElementById("photo").files[0];

if(photo && photo.size>20*1024*1024){
alert("Photo size should not exceed 20 MB.");
return;
}

document.getElementById("formPage").style.display="none";
document.getElementById("thankyou").style.display="block";

});

</script>

</body>
</html>
